name: Security Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-api-tests:
    name: data-api-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-tp4-dados.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-tp4-dados.txt
          python -m pip check

      # conftest.py define SECRET_KEY e banco temporário; nada de .env no CI.
      - name: Run data and API security tests
        run: python -m pytest tests/ -v --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

  # Dependências do SDK ficam isoladas das dependências da API.
  agent-tests:
    name: agent-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-tp4-agent.txt

      - name: Install agent dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-tp4-agent.txt
          python -m pip check

      # Modelo e HTTP são simulados; não exige chave OpenAI, JWT ou serviços externos.
      - name: Run offline agent tests
        run: python -m pytest agent_tests/ -v --junitxml=agent-pytest-report.xml

      - name: Upload agent test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-pytest-report
          path: agent-pytest-report.xml

  # Preserva o nome do check existente para as regras de proteção da main.
  security-tests:
    name: security-tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [data-api-tests, agent-tests]
    if: ${{ always() }}

    steps:
      - name: Require both test suites to succeed
        env:
          DATA_API_RESULT: ${{ needs.data-api-tests.result }}
          AGENT_RESULT: ${{ needs.agent-tests.result }}
        run: |
          if [ "$DATA_API_RESULT" != "success" ] || [ "$AGENT_RESULT" != "success" ]; then
            echo "Test suites did not both succeed: data/API=$DATA_API_RESULT; agent=$AGENT_RESULT"
            exit 1
          fi
          echo "Data/API and offline agent tests passed."
